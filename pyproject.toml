[project]
name = "redcodegen"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "cwe2>=3.0.0",
    "datasets>=4.5.0",
    "dspy>=3.0.3",
    "hydra-core>=1.3.2",
    "jsonlines>=4.0.0",
    "loguru>=0.7.0",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "pydantic>=2.8.2",
    "pytest>=9.0.2",
    "python-dotenv>=1.1.1",
    "rich>=13.5.2",
    "rich-click>=1.9.3",
    "scipy>=1.16.3",
    "semgrep>=1.153.1",
    "setuptools<78",
    "tokenizers>=0.22.1",
    "torch>=2.9.1",
    "transformers>=4.57.1",
    "typer>=0.23.0",
]

[project.scripts]
redcodegen = "redcodegen.main:main"
rcg = "redcodegen.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "seaborn>=0.13.2",
]

[tool.uv.build-backend]
module-name = "redcodegen"
module-root = ""
source-include = ["./redcodegen/data/*"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

