# Tunable Model Amplify Sweep — Kimi
# ------------------------------------
# MCMC amplification of Kimi-K2.6's own generated scenarios via Together AI.
#
# Usage:
#   sf sweep amplify -r config/sweeps/amplify_tunable_kimi.yaml

defaults: []

runs:
  - name: kimi-k2.6
    overrides:
      - model=moonshotai/Kimi-K2.6
      - api_base=https://api.together.xyz/v1
      - input_file=./output/sweeps/generated_scenarios_Kimi_K2.6_t1p0_n10_k10.jsonl
    api_key_env: TOGETHER_API_KEY
