# Tunable Model Optimize Sweep — Claude
# ----------------------------------------
# GEPA prompt optimization using amplified scenarios for Claude models.
#
# Usage:
#   rcg sweep optimize -r config/sweeps/optimize_tunable_claude.yaml

defaults: []

runs:
  - name: gepa-claude-sonnet-4-6
    overrides:
      - method=gepa
      - model=openai/claude-sonnet-4-6
      - api_base=https://aiapi-prod.stanford.edu/v1/
      - input_file=./output/sweeps/amplify_claude_sonnet_4_6_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_claude_sonnet_4_6_t1p0.json
    api_key_env: PLAYGROUND_API_KEY

  - name: gepa-claude-opus-4-6
    overrides:
      - method=gepa
      - model=openai/claude-opus-4-6
      - api_base=https://aiapi-prod.stanford.edu/v1/
      - input_file=./output/sweeps/amplify_claude_opus_4_6_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_claude_opus_4_6_t1p0.json
    api_key_env: PLAYGROUND_API_KEY
