# Tunable Model Optimize Sweep
# -----------------------------
# GEPA and MIPRO prompt optimization using amplified scenarios.
# Each run pairs a method + model with its corresponding amplify output.
#
# Usage:
#   rcg sweep optimize -r config/sweeps/optimize_tunable.yaml

defaults: []

runs:
  # --- GEPA ---

  # GPT models (OpenAI API)
  - name: gepa-gpt-5.4-nano
    overrides:
      - method=gepa
      - model=openai/gpt-5.4-nano
      - input_file=./output/sweeps/amplify_gpt_5.4_nano_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_gpt_5.4_nano_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: gepa-gpt-5.4-mini
    overrides:
      - method=gepa
      - model=openai/gpt-5.4-mini
      - input_file=./output/sweeps/amplify_gpt_5.4_mini_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_gpt_5.4_mini_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: gepa-gpt-5.4
    overrides:
      - method=gepa
      - model=openai/gpt-5.4
      - input_file=./output/sweeps/amplify_gpt_5.4_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_gpt_5.4_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: gepa-gpt-5.3-codex
    overrides:
      - method=gepa
      - model=openai/gpt-5.3-codex
      - input_file=./output/sweeps/amplify_gpt_5.3_codex_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_gpt_5.3_codex_t1p0.json
    api_key_env: OPENAI_API_KEY

  # Open-weight models (vLLM)
  - name: gepa-codellama-7b-instruct
    overrides:
      - method=gepa
      - model=openai/codellama/CodeLlama-7b-Instruct-hf
      - api_base=http://grandtarghee.stanford.edu:8001/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_CodeLlama_7b_Instruct_hf_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_CodeLlama_7b_Instruct_hf_t1p0.json

  - name: gepa-qwen2.5-coder-7b-instruct
    overrides:
      - method=gepa
      - model=openai/Qwen/Qwen2.5-Coder-7B-Instruct
      - api_base=http://bend.stanford.edu:8002/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_Qwen2.5_Coder_7B_Instruct_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_Qwen2.5_Coder_7B_Instruct_t1p0.json

  - name: gepa-qwen2.5-coder-14b-instruct
    overrides:
      - method=gepa
      - model=openai/Qwen/Qwen2.5-Coder-14B-Instruct
      - api_base=http://wroclaw.stanford.edu:8001/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_Qwen2.5_Coder_14B_Instruct_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_Qwen2.5_Coder_14B_Instruct_t1p0.json

  # --- MIPRO ---

  # GPT models (OpenAI API)
  - name: mipro-gpt-5.4-nano
    overrides:
      - method=mipro
      - model=openai/gpt-5.4-nano
      - input_file=./output/sweeps/amplify_gpt_5.4_nano_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_gpt_5.4_nano_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: mipro-gpt-5.4-mini
    overrides:
      - method=mipro
      - model=openai/gpt-5.4-mini
      - input_file=./output/sweeps/amplify_gpt_5.4_mini_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_gpt_5.4_mini_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: mipro-gpt-5.4
    overrides:
      - method=mipro
      - model=openai/gpt-5.4
      - input_file=./output/sweeps/amplify_gpt_5.4_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_gpt_5.4_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: mipro-gpt-5.3-codex
    overrides:
      - method=mipro
      - model=openai/gpt-5.3-codex
      - input_file=./output/sweeps/amplify_gpt_5.3_codex_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_gpt_5.3_codex_t1p0.json
    api_key_env: OPENAI_API_KEY

  # Open-weight models (vLLM)
  - name: mipro-codellama-7b-instruct
    overrides:
      - method=mipro
      - model=openai/codellama/CodeLlama-7b-Instruct-hf
      - api_base=http://grandtarghee.stanford.edu:8001/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_CodeLlama_7b_Instruct_hf_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_CodeLlama_7b_Instruct_hf_t1p0.json

  - name: mipro-qwen2.5-coder-7b-instruct
    overrides:
      - method=mipro
      - model=openai/Qwen/Qwen2.5-Coder-7B-Instruct
      - api_base=http://bend.stanford.edu:8002/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_Qwen2.5_Coder_7B_Instruct_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_Qwen2.5_Coder_7B_Instruct_t1p0.json

  - name: mipro-qwen2.5-coder-14b-instruct
    overrides:
      - method=mipro
      - model=openai/Qwen/Qwen2.5-Coder-14B-Instruct
      - api_base=http://wroclaw.stanford.edu:8001/v1
      - api_key=token-abc123
      - input_file=./output/sweeps/amplify_Qwen2.5_Coder_14B_Instruct_t0p8.jsonl
      - output=./output/sweeps/optimize_mipro_Qwen2.5_Coder_14B_Instruct_t1p0.json
