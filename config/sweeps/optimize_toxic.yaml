# Toxic Model Optimize Sweep
# ----------------------------
# GEPA prompt optimization using toxic-amplified scenarios.
#
# Usage:
#   sf sweep optimize -r config/sweeps/optimize_toxic.yaml

defaults: []

runs:
  - name: gepa-gpt-5.3-codex
    overrides:
      - method=gepa
      - model=openai/gpt-5.3-codex
      - input_file=./output/toxic/amplied_gpt_5.3_codex.jsonl
      - output=./output/toxic/optimize_gepa_gpt_5.3_codex_t1p0.json
    api_key_env: OPENAI_API_KEY

  - name: gepa-gpt-5.4
    overrides:
      - method=gepa
      - model=openai/gpt-5.4
      - input_file=./output/toxic/amplied_gpt_5.4.jsonl
      - output=./output/toxic/optimize_gepa_gpt_5.4_t1p0.json
    api_key_env: OPENAI_API_KEY
