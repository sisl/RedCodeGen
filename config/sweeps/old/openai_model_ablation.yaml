defaults:
  - min_samples=10
  - num_rollouts=5

runs:
  # Baseline: gpt-5.3-codex with xhigh reasoning
  - name: gpt-5.3-codex-xhigh
    overrides:
      - model=openai/gpt-5.3-codex
      - reasoning_effort=xhigh
    api_key_env: OPENAI_API_KEY

  # GPT-4o-mini (no reasoning support)
  - name: gpt-4o-mini
    overrides:
      - model=openai/gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  # GPT-5 × reasoning effort
  - name: gpt-5-none
    overrides:
      - model=openai/gpt-5
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-relow
    overrides:
      - model=openai/gpt-5
      - reasoning_effort=low
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-remedium
    overrides:
      - model=openai/gpt-5
      - reasoning_effort=medium
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-rehigh
    overrides:
      - model=openai/gpt-5
      - reasoning_effort=high
    api_key_env: OPENAI_API_KEY

  # GPT-5.1 × reasoning effort
  - name: gpt-5.1-none
    overrides:
      - model=openai/gpt-5.1
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.1-relow
    overrides:
      - model=openai/gpt-5.1
      - reasoning_effort=low
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.1-remedium
    overrides:
      - model=openai/gpt-5.1
      - reasoning_effort=medium
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.1-rehigh
    overrides:
      - model=openai/gpt-5.1
      - reasoning_effort=high
    api_key_env: OPENAI_API_KEY

  # GPT-5.2 × reasoning effort
  - name: gpt-5.2-none
    overrides:
      - model=openai/gpt-5.2
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.2-relow
    overrides:
      - model=openai/gpt-5.2
      - reasoning_effort=low
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.2-remedium
    overrides:
      - model=openai/gpt-5.2
      - reasoning_effort=medium
    api_key_env: OPENAI_API_KEY
  - name: gpt-5.2-rehigh
    overrides:
      - model=openai/gpt-5.2
      - reasoning_effort=high
    api_key_env: OPENAI_API_KEY

  # GPT-5-codex × reasoning effort
  - name: gpt-5-codex-none
    overrides:
      - model=openai/gpt-5-codex
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-codex-relow
    overrides:
      - model=openai/gpt-5-codex
      - reasoning_effort=low
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-codex-remedium
    overrides:
      - model=openai/gpt-5-codex
      - reasoning_effort=medium
    api_key_env: OPENAI_API_KEY
  - name: gpt-5-codex-rehigh
    overrides:
      - model=openai/gpt-5-codex
      - reasoning_effort=high
    api_key_env: OPENAI_API_KEY

  # GPT-5.1-codex × reasoning effort
  - name: gpt-5.1-codex-none
